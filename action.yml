name: Run Robot Framework tests
description: "Runs Robot Framework tests (robot -d results tests)"
branding:
  icon: "fast-forward"
  color: "purple"

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4

    - name: Set default values for environment variables
      shell: bash
      run: |
        echo "WOPEE_SCREENSHOT_VALIDATION_ENABLED=${WOPEE_SCREENSHOT_VALIDATION_ENABLED:-true}" >> $GITHUB_ENV
        echo "WOPEE_COLLECT_PAGE_CONTENT=${WOPEE_COLLECT_PAGE_CONTENT:-true}" >> $GITHUB_ENV
        echo "WOPEE_DRIVER_LIBRARY=${WOPEE_DRIVER_LIBRARY:-BrowserLibrary}" >> $GITHUB_ENV

    - name: Load .github/workflows/.env → $GITHUB_ENV
      # Loaded before the dispatch payload, so values sent by Commander win.
      shell: bash
      run: |
        if [ -f .github/workflows/.env ]; then
          # Valid KEY=VALUE lines only; unfilled template placeholders like {wopeeProjectUuid} are skipped.
          grep -vE '^(#|$)' .github/workflows/.env | \
            grep -E '^[A-Za-z_][A-Za-z0-9_]*=' | \
            grep -vE '=\{[A-Za-z]+\}$' \
            >> "$GITHUB_ENV" || true
        fi

    - name: Load client_payload.env → $GITHUB_ENV
      if: github.event.client_payload.env
      shell: bash
      run: |
        jq -r '
          .client_payload.env
          | to_entries[]
          | select(.value != null)
          | if (.value | type=="string" and test("\n"))
              then "\(.key)<<EOF\n\(.value)\nEOF"
              else "\(.key)=\(.value)"
            end
        ' "$GITHUB_EVENT_PATH" >> "$GITHUB_ENV"

    - name: Set suite name if provided
      if: github.event_name == 'repository_dispatch' && github.event.client_payload.suite.name != null
      shell: bash
      run: |
        echo 'WOPEE_SUITE_NAME=${{ github.event.client_payload.suite.name }}' >> $GITHUB_ENV

    - name: Check project settings
      shell: bash
      run: |
        if [ -z "${WOPEE_PROJECT_UUID:-}" ]; then
          echo "::error title=WOPEE_PROJECT_UUID is not set::Add WOPEE_PROJECT_UUID (and WOPEE_API_URL, WOPEE_PROJECT_URL) as uncommented KEY=value lines to .github/workflows/.env. Commander › More › Settings › API Keys shows the values."
          exit 1
        fi

    - name: Install
      shell: bash
      run: |
        python3 -m venv --system-site-packages .venv
        source .venv/bin/activate
        pip install -r requirements.txt
        # Download the Browser library's Node.js dependencies and Chromium unless they are already there.
        if ! python -c "import Browser, pathlib, sys; sys.exit(0 if (pathlib.Path(Browser.__file__).parent / 'wrapper' / 'node_modules').is_dir() else 1)"; then
          rfbrowser init chromium
        fi

    - name: Run tests
      shell: bash
      run: |
        source .venv/bin/activate
        # Repos generated before Oct 2026 run their tests through `make test`.
        if [ -f Makefile ] && grep -q '^test:' Makefile; then
          make test
        else
          robot -d results tests
        fi

    - name: Confirm end of run
      if: always()
      shell: bash
      run: |
        ERROR_FLAG=false
        if [ "${{ job.status }}" = "failure" ]; then
          ERROR_FLAG=true
        fi

        if [ "${{ github.event.action }}" = "code" ]; then
          JSON_PAYLOAD=$(jq -n \
            --arg error "$ERROR_FLAG" \
            --arg projectUuid "${{ env.WOPEE_PROJECT_UUID }}" \
            --arg suiteUuid "${{ env.WOPEE_SUITE_UUID }}" \
            --arg testCaseId "${{ env.WOPEE_TEST_CASE_ID }}" \
            --arg userStoryId "${{ env.WOPEE_USER_STORY_ID }}" \
            '{
              query: "mutation PostProcessAgentSuite($input: PostProcessAgentSuiteInput!) { postProcessAgentSuite(input: $input) }",
              variables: {
                input: {
                  error: ($error == "true"),
                  projectUuid: $projectUuid,
                  suiteUuid: $suiteUuid,
                  testCase: {
                    testCaseId: $testCaseId,
                    userStoryId: $userStoryId
                  }
                }
              }
            }')

          curl --request POST \
            --header 'content-type: application/json' \
            --header "api_key: ${{ env.WOPEE_API_KEY }}" \
            --url "${{ env.WOPEE_API_URL }}" \
            --data "$JSON_PAYLOAD"
        fi

    - name: Set artifact timestamp
      if: always()
      shell: bash
      run: echo "ARTIFACT_TIMESTAMP=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        # use timestamp for artifact name
        name: robot-framework-results-${{ env.ARTIFACT_TIMESTAMP }}
        path: |
          results/*
          reports/*
        retention-days: 1
        if-no-files-found: ignore
